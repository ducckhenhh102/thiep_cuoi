<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <rect width="300" height="300" fill="#ffffff" rx="16"/>
  <!-- Decorative border -->
  <rect x="12" y="12" width="276" height="276" fill="none" stroke="#D6B98C" stroke-width="2" rx="12"/>
  <!-- Header Text -->
  <text x="150" y="45" font-family="'Cormorant Garamond', serif" font-size="20" font-weight="bold" fill="#5C5050" text-anchor="middle">MỪNG CƯỚI NHÀ TRAI</text>
  <text x="150" y="68" font-family="'Be Vietnam Pro', sans-serif" font-size="12" fill="#8C7A7A" text-anchor="middle">Quét mã VietQR để gửi quà mừng</text>
  <!-- Stylized QR Grid representation -->
  <g fill="#5C5050" transform="translate(45, 85)">
    <!-- Top-left finder -->
    <rect x="0" y="0" width="60" height="60" fill="none" stroke="#5C5050" stroke-width="8" rx="6"/>
    <rect x="16" y="16" width="28" height="28" rx="3"/>
    <!-- Top-right finder -->
    <rect x="150" y="0" width="60" height="60" fill="none" stroke="#5C5050" stroke-width="8" rx="6"/>
    <rect x="166" y="16" width="28" height="28" rx="3"/>
    <!-- Bottom-left finder -->
    <rect x="0" y="150" width="60" height="60" fill="none" stroke="#5C5050" stroke-width="8" rx="6"/>
    <rect x="16" y="166" width="28" height="28" rx="3"/>
    <!-- Random pattern dots for authentic look -->
    <rect x="80" y="15" width="20" height="15" rx="2"/><rect x="115" y="10" width="18" height="20" rx="2"/>
    <rect x="75" y="45" width="25" height="16" rx="2"/><rect x="120" y="40" width="16" height="18" rx="2"/>
    <rect x="15" y="75" width="18" height="20" rx="2"/><rect x="45" y="80" width="16" height="15" rx="2"/>
    <rect x="80" y="75" width="50" height="50" rx="4" fill="#E8F1EC"/>
    <!-- Center Wedding Rings Icon -->
    <circle cx="100" cy="100" r="12" fill="none" stroke="#D6B98C" stroke-width="4"/>
    <circle cx="110" cy="100" r="12" fill="none" stroke="#b07070" stroke-width="4"/>
    <rect x="155" y="75" width="16" height="20" rx="2"/><rect x="180" y="80" width="22" height="16" rx="2"/>
    <rect x="145" y="115" width="25" height="18" rx="2"/><rect x="180" y="110" width="22" height="20" rx="2"/>
    <rect x="75" y="140" width="20" height="18" rx="2"/><rect x="115" y="145" width="18" height="22" rx="2"/>
    <rect x="85" y="170" width="22" height="20" rx="2"/><rect x="120" y="175" width="18" height="20" rx="2"/>
    <rect x="150" y="145" width="25" height="20" rx="2"/><rect x="185" y="155" width="18" height="18" rx="2"/>
    <rect x="160" y="175" width="22" height="20" rx="2"/>
  </g>
</svg>
